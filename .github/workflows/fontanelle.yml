# Aggiorna ogni settimana fontanelle.json (le fontanelle che l'app legge al primo avvio)
# e luoghi.json (i luoghi notevoli che la navigazione indica lungo la strada).
name: Aggiorna le fontanelle

on:
  schedule:
    - cron: '17 4 * * 1'   # ogni lunedì mattina
  workflow_dispatch:        # e a mano, dalla scheda Actions
  push:
    branches: [main]
    paths: ['strumenti/fontanelle.mjs', 'strumenti/luoghi.mjs', '.github/workflows/fontanelle.yml']

permissions:
  contents: write
  pages: write

concurrency:
  group: fontanelle
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scarica da OpenStreetMap
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: node strumenti/fontanelle.mjs
      - name: Scarica i luoghi notevoli
        continue-on-error: true
        run: node strumenti/luoghi.mjs
      - name: Salva se è cambiato qualcosa
        id: salva
        run: |
          git add fontanelle.json luoghi.json 2>/dev/null || git add fontanelle.json
          if git diff --cached --quiet; then
            echo "cambiato=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna fontanelle e luoghi da OpenStreetMap"
          git push
          echo "cambiato=si" >> "$GITHUB_OUTPUT"
      - name: Ripubblica il sito
        if: steps.salva.outputs.cambiato == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pubblicazione già in corso"
